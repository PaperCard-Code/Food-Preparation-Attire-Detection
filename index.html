<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Preparation Attire Detection</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0/dist/tf.min.js"></script>
    <!-- Teachable Machine Image library -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            font-size: 18px;
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 5px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        #status {
            font-weight: bold;
            margin-bottom: 15px;
        }

        #webcam-container {
            width: 300px;
            height: 300px;
            border: 3px solid #4CAF50;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        #webcam-container canvas {
            width: 300px;
            height: 300px;
            display: block;
            margin: 0 auto;
        }

        #label-container {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bar {
            background-color: #4CAF50;
            height: 20px;
            border-radius: 5px;
            transition: width 0.2s ease;
        }

        .label-text {
            min-width: 80px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Food Preparation Attire Detection</h1>
    <p id="status">Status: Waiting</p>
    <div>
        <button id="start-button">Start Detection</button>
        <button id="stop-button">Stop Detection</button>
    </div>

    <div id="webcam-container"></div>
    <div id="label-container"></div>

<script>
const URL = "model/";
let model, webcam, labelContainer, maxPredictions;
let isRunning = false;

document.getElementById("stop-button").disabled = true;

document.getElementById("start-button").addEventListener("click", async () => {
    if (isRunning) return;
    isRunning = true;
    document.getElementById("start-button").disabled = true;
    document.getElementById("stop-button").disabled = false;
    await init();
});

document.getElementById("stop-button").addEventListener("click", () => {
    if (webcam) {
        webcam.stop();
        isRunning = false;
        document.getElementById("status").innerText = "Status: Stopped";
        document.getElementById("start-button").disabled = false;
        document.getElementById("stop-button").disabled = true;
    }
});

async function init() {
    try {
        document.getElementById("status").innerText = "Status: Loading model...";
        model = await tmImage.load(URL + "model.json", URL + "metadata.json");
        maxPredictions = model.getTotalClasses();

        document.getElementById("status").innerText = "Status: Starting webcam...";
        webcam = new tmImage.Webcam(300, 300, true);
        await webcam.setup();
        await webcam.play();
        document.getElementById("webcam-container").appendChild(webcam.canvas);

        // Prepare label container with bars
        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
            const div = document.createElement("div");
            div.className = "label-bar";
            const labelText = document.createElement("div");
            labelText.className = "label-text";
            labelText.innerText = "Class " + i;
            const barWrapper = document.createElement("div");
            barWrapper.style.flexGrow = "1";
            const bar = document.createElement("div");
            bar.className = "bar";
            bar.style.width = "0%";
            barWrapper.appendChild(bar);

            div.appendChild(labelText);
            div.appendChild(barWrapper);
            labelContainer.appendChild(div);
        }

        document.getElementById("status").innerText = "Status: Running ✅";
        window.requestAnimationFrame(loop);

    } catch (err) {
        document.getElementById("status").innerText = "ERROR: " + err.message;
        console.error(err);
    }
}

async function loop() {
    if (!isRunning) return;
    webcam.update();
    const prediction = await model.predict(webcam.canvas);
    for (let i = 0; i < maxPredictions; i++) {
        const div = labelContainer.childNodes[i];
        div.querySelector(".label-text").innerText = prediction[i].className;
        div.querySelector(".bar").style.width = (prediction[i].probability * 100).toFixed(1) + "%";
    }
    window.requestAnimationFrame(loop);
}
</script>
</body>
</html>
