<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teachable Machine Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
</head>

<body>
    <h1>Food Preparation Attire Detection</h1>
    <button onclick="init()">Start</button>

    <p id="status">Status: Waiting</p>
    <div id="webcam-container"></div>
    <div id="label-container"></div>

<script>
const URL = "model/";
let model, webcam, labelContainer, maxPredictions;

async function init() {
    try {
        document.getElementById("status").innerText = "Status: Loading model...";
        model = await tmImage.load(URL + "model.json", URL + "metadata.json");
        maxPredictions = model.getTotalClasses();

        document.getElementById("status").innerText = "Status: Starting webcam...";
        webcam = new tmImage.Webcam(200, 200, true);
        await webcam.setup();
        await webcam.play();
        document.getElementById("webcam-container").appendChild(webcam.canvas);

        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
            labelContainer.appendChild(document.createElement("div"));
        }

        document.getElementById("status").innerText = "Status: Running ✅";
        window.requestAnimationFrame(loop);
    } catch (err) {
        document.getElementById("status").innerText = "ERROR: " + err.message;
        console.error(err);
    }
}

async function loop() {
    webcam.update();
    const prediction = await model.predict(webcam.canvas);
    for (let i = 0; i < maxPredictions; i++) {
        labelContainer.childNodes[i].innerText =
            prediction[i].className + ": " + prediction[i].probability.toFixed(2);
    }
    window.requestAnimationFrame(loop);
}
</script>

</body>
</html>
